name: Go
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.6' # The Go version to download (if necessary) and use.
    - run: sudo apt-get install libasound2t64
           make
